<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120e0c">
  <title>Dumpling 67</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #120e0c; color: #f4efe8;
      overflow: hidden; touch-action: none;
      font-family: system-ui, sans-serif;
    }
    #unity-container { width: 100%; height: 100%; position: relative; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #120e0c; }
    #unity-loading-bar {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: min(280px, 70vw); text-align: center;
    }
    #unity-progress-bar-empty {
      height: 6px; background: #2c2723; border-radius: 3px; overflow: hidden;
    }
    #unity-progress-bar-full {
      height: 100%; width: 0%; background: #d8d2c8; transition: width 0.15s linear;
    }
    #unity-logo { margin-bottom: 16px; font-size: 14px; letter-spacing: 0.04em; opacity: 0.85; }
    #unity-warning {
      position: absolute; left: 0; right: 0; top: 0; padding: 12px;
      background: #c45c4a; color: #fff; text-align: center; display: none;
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/sdk.js" onerror="console.log('[YG] sdk.js not found — ok outside Yandex')"></script>
</head>
<body>
  <div id="unity-warning"></div>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo">DUMPLING 67</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor("#120e0c");
        if (tg.setBackgroundColor) tg.setBackgroundColor("#120e0c");
      } catch (e) { console.log(e); }
    })();

    // Unity loader (standard template placeholders)
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Dumpling67",
      productName: "Dumpling 67",
      productVersion: "1.0"
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      warningBanner.style.display = "block";
      warningBanner.textContent = msg;
      if (type === "error") warningBanner.style.background = "#c45c4a";
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        loadingBar.style.display = "none";
        window.unityInstance = instance;
        // Yandex GameReady if available
        if (window.YaGames) {
          YaGames.init().then(function (ysdk) {
            window.ysdk = ysdk;
            if (ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready();
          }).catch(function () {});
        }
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
